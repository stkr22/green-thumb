# commit-msg is needed for conventional-pre-commit; `pre-commit install` only
# installs the pre-commit stage unless told otherwise.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
    - id: conventional-pre-commit
      stages: [commit-msg]
      args: []

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
        # devcontainer.json is JSONC: comments are allowed and used there.
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        # Helm templates are Go templates, not YAML, until rendered.
        exclude: ^charts/[^/]+/templates/
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ruff and ty run through `uv run` so hooks use the versions locked in uv.lock,
  # the same ones CI uses; a separately pinned hook rev drifts from the lockfile.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
    - id: python-check-blanket-noqa
    - id: python-check-blanket-type-ignore

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit

  - repo: meta
    hooks:
      - id: check-useless-excludes
